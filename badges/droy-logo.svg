<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="90" fill="url(#grad1)" opacity="0.1"/>
  <circle cx="100" cy="100" r="80" fill="none" stroke="url(#grad1)" stroke-width="3"/>
  
  <!-- Inner Circle -->
  <circle cx="100" cy="100" r="60" fill="url(#grad2)" opacity="0.2"/>
  
  <!-- D Letter -->
  <text x="100" y="125" font-family="Arial, sans-serif" font-size="90" font-weight="bold" 
        fill="url(#grad1)" text-anchor="middle" filter="url(#glow)">D</text>
  
  <!-- Decorative Dots -->
  <circle cx="40" cy="50" r="6" fill="#6366f1"/>
  <circle cx="160" cy="50" r="6" fill="#ec4899"/>
  <circle cx="40" cy="150" r="6" fill="#10b981"/>
  <circle cx="160" cy="150" r="6" fill="#3b82f6"/>
  
  <!-- Connection Lines -->
  <line x1="46" y1="50" x2="100" y2="85" stroke="#6366f1" stroke-width="2" opacity="0.5"/>
  <line x1="154" y1="50" x2="100" y2="85" stroke="#ec4899" stroke-width="2" opacity="0.5"/>
  <line x1="46" y1="150" x2="100" y2="115" stroke="#10b981" stroke-width="2" opacity="0.5"/>
  <line x1="154" y1="150" x2="100" y2="115" stroke="#3b82f6" stroke-width="2" opacity="0.5"/>
</svg>
